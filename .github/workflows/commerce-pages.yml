name: Deploy commerce analysis to Pages
on:
  push:
    branches: [main]
    paths: ['db-gpt-commerce/**', '.github/workflows/commerce-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: commerce-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-gpt-commerce/web/package-lock.json
      - run: npm ci
        working-directory: db-gpt-commerce/web
      - run: npm run build
        working-directory: db-gpt-commerce/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: db-gpt-commerce/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
